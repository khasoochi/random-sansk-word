{% extends "base.html" %}
{% block title %}Random Sanskrit Words{% endblock %}
{% block content %}
<header class="page-header">
    <h1 class="sanskrit-title small">यादृच्छिक शब्द</h1>
    <p class="description">Generate random Sanskrit words from the Apte Dictionary with English and Hindi meanings.</p>
</header>

<div class="control-panel">
    <div class="input-group">
        <label for="wordCount">Number of Words:</label>
        <input type="number" id="wordCount" min="1" max="100" value="5" />
    </div>
    <button id="generateBtn" class="btn-primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
        Generate Random Words
    </button>
    <div class="stats" id="stats"><span id="totalWords">Loading...</span></div>
</div>

<div id="loading" class="loading" style="display: none;">
    <div class="spinner"></div>
    <p>Generating words...</p>
</div>

<div id="results" class="results-container"></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/random.js') }}"></script>
{% endblock %}
